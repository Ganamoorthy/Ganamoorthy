<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="60%" stop-color="#060d17"/>
      <stop offset="100%" stop-color="#040910"/>
    </linearGradient>

    <!-- Meter Bar Gradients: High Vibrancy & Contrast -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066eb"/>
      <stop offset="60%" stop-color="#00d8f6"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052d4"/>
      <stop offset="70%" stop-color="#00b4db"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3c72"/>
      <stop offset="60%" stop-color="#2a5298"/>
      <stop offset="100%" stop-color="#56ccf2"/>
    </linearGradient>

    <!-- Shimmer Highlight Sweep -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Clear Micro Grid -->
    <pattern id="diagGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00e5ff" stroke-width="0.6" stroke-opacity="0.08"/>
      <circle cx="24" cy="0" r="0.8" fill="#00e5ff" fill-opacity="0.18"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 700; fill: #FFFFFF; }
    .sub-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: 600; fill: #93c5fd; }
  </style>

  <!-- Panel Base Container with Clear Border -->
  <rect x="2" y="2" width="796" height="336" rx="14" fill="url(#panelBg)" stroke="#1f3a58" stroke-width="1.8"/>
  <rect x="2" y="2" width="796" height="336" rx="14" fill="url(#diagGrid)"/>

  <!-- Top Accent Highlight Line -->
  <path d="M 20 2 H 780" stroke="url(#barGrad1)" stroke-width="2" stroke-opacity="0.9"/>

  <!-- Header Section -->
  <g transform="translate(28, 22)">
    <rect x="0" y="1" width="18" height="18" rx="4" fill="#0c2338" stroke="#00e5ff" stroke-width="1.5"/>
    <path d="M 3 10 H 6 L 8 4 L 12 16 L 14 10 H 16" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="26" y="15" fill="#f0f9ff" class="font-mono" font-size="12.5" font-weight="bold" letter-spacing="1.5">
      CORE COMPETENCIES &amp; SKILL ARCHITECTURE
    </text>

    <!-- Status Badge -->
    <g transform="translate(615, 0)">
      <rect x="0" y="0" width="128" height="20" rx="10" fill="#08221c" stroke="#00ffa3" stroke-width="1.2"/>
      <circle cx="12" cy="10" r="4" fill="#00ffa3">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="14" fill="#00ffa3" class="font-mono" font-size="9.5" font-weight="bold" letter-spacing="1">SYSTEM OPTIMAL</text>
    </g>
  </g>

  <!-- Decorative Separator -->
  <line x1="28" y1="52" x2="772" y2="52" stroke="#16314a" stroke-width="1.2"/>

  <!-- ================= ROW 1: Embedded Systems ================= -->
  <g transform="translate(28, 66)">
    <!-- Icon: Microcontroller -->
    <g transform="translate(0, 1)">
      <rect x="0" y="2" width="24" height="24" rx="5" fill="#0e263d" stroke="#00e5ff" stroke-width="1.5"/>
      <rect x="5" y="7" width="14" height="14" rx="2.5" fill="#00e5ff" fill-opacity="0.3"/>
      <line x1="5" y1="0" x2="5" y2="2" stroke="#00e5ff" stroke-width="1.4"/>
      <line x1="12" y1="0" x2="12" y2="2" stroke="#00e5ff" stroke-width="1.4"/>
      <line x1="19" y1="0" x2="19" y2="2" stroke="#00e5ff" stroke-width="1.4"/>
      <line x1="5" y1="26" x2="5" y2="28" stroke="#00e5ff" stroke-width="1.4"/>
      <line x1="12" y1="26" x2="12" y2="28" stroke="#00e5ff" stroke-width="1.4"/>
      <line x1="19" y1="26" x2="19" y2="28" stroke="#00e5ff" stroke-width="1.4"/>
    </g>

    <!-- Labels with Crystal Clear Visibility -->
    <text x="34" y="15" class="title-text">Embedded Systems</text>
    <text x="34" y="29" class="sub-text">Firmware • RTOS • ESP32 • STM32</text>

    <!-- High-Contrast Track & Meter -->
    <g transform="translate(260, 6)">
      <rect x="0" y="0" width="390" height="18" rx="9" fill="#0e1d2e" stroke="#1c3a57" stroke-width="1.2"/>
      <line x1="97" y1="0" x2="97" y2="18" stroke="#162e45" stroke-width="1"/>
      <line x1="195" y1="0" x2="195" y2="18" stroke="#162e45" stroke-width="1"/>
      <line x1="292" y1="0" x2="292" y2="18" stroke="#162e45" stroke-width="1"/>
      
      <!-- Animated Active Bar (94% of 390 = 366px) -->
      <rect x="0" y="0" width="366" height="18" rx="9" fill="url(#barGrad1)" filter="url(#softGlow)">
        <animate attributeName="width" values="350;366;358;366" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Shimmer beam effect -->
      <rect x="0" y="0" width="75" height="18" rx="9" fill="url(#shimmerGrad)">
        <animate attributeName="x" values="-75;390" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Badge -->
    <g transform="translate(665, 4)">
      <rect x="0" y="0" width="80" height="22" rx="5" fill="#0c253b" stroke="#00e5ff" stroke-width="1.2"/>
      <text x="40" y="15" text-anchor="middle" fill="#00f3fe" class="font-mono" font-size="10.5" font-weight="bold">CORE 94%</text>
    </g>
  </g>

  <!-- ================= ROW 2: Electronics ================= -->
  <g transform="translate(28, 118)">
    <g transform="translate(0, 1)">
      <rect x="0" y="2" width="24" height="24" rx="5" fill="#0e263d" stroke="#00d2ff" stroke-width="1.5"/>
      <circle cx="12" cy="14" r="4.5" fill="none" stroke="#00d2ff" stroke-width="1.4"/>
      <line x1="2" y1="14" x2="7.5" y2="14" stroke="#00d2ff" stroke-width="1.4"/>
      <line x1="16.5" y1="14" x2="22" y2="14" stroke="#00d2ff" stroke-width="1.4"/>
      <line x1="12" y1="5" x2="12" y2="9.5" stroke="#00d2ff" stroke-width="1.4"/>
    </g>

    <text x="34" y="15" class="title-text">Electronics</text>
    <text x="34" y="29" class="sub-text">Circuits • Sensors • Power Systems</text>

    <g transform="translate(260, 6)">
      <rect x="0" y="0" width="390" height="18" rx="9" fill="#0e1d2e" stroke="#1c3a57" stroke-width="1.2"/>
      <line x1="97" y1="0" x2="97" y2="18" stroke="#162e45" stroke-width="1"/>
      <line x1="195" y1="0" x2="195" y2="18" stroke="#162e45" stroke-width="1"/>
      <line x1="292" y1="0" x2="292" y2="18" stroke="#162e45" stroke-width="1"/>
      
      <!-- Animated Active Bar (90% of 390 = 351px) -->
      <rect x="0" y="0" width="351" height="18" rx="9" fill="url(#barGrad2)">
        <animate attributeName="width" values="335;351;343;351" dur="3.8s" repeatCount="indefinite"/>
      </rect>

      <rect x="0" y="0" width="75" height="18" rx="9" fill="url(#shimmerGrad)">
        <animate attributeName="x" values="-75;390" dur="3.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(665, 4)">
      <rect x="0" y="0" width="80" height="22" rx="5" fill="#0c253b" stroke="#00d2ff" stroke-width="1.2"/>
      <text x="40" y="15" text-anchor="middle" fill="#00d2ff" class="font-mono" font-size="10.5" font-weight="bold">CORE 90%</text>
    </g>
  </g>

  <!-- ================= ROW 3: IoT & Communication ================= -->
  <g transform="translate(28, 170)">
    <g transform="translate(0, 1)">
      <rect x="0" y="2" width="24" height="24" rx="5" fill="#0e263d" stroke="#00e5ff" stroke-width="1.5"/>
      <path d="M 6 11 A 8 8 0 0 1 18 11" fill="none" stroke="#00e5ff" stroke-width="1.4"/>
      <path d="M 4 8 A 11 11 0 0 1 20 8" fill="none" stroke="#00e5ff" stroke-width="1.4"/>
      <circle cx="12" cy="17" r="2.2" fill="#00e5ff"/>
    </g>

    <text x="34" y="15" class="title-text">IoT &amp; Communication</text>
    <text x="34" y="29" class="sub-text">MQTT • Wi-Fi • 4G LTE • Node-RED</text>

    <g transform="translate(260, 6)">
      <rect x="0" y="0" width="390" height="18" rx="9" fill="#0e1d2e" stroke="#1c3a57" stroke-width="1.2"/>
      <line x1="97" y1="0" x2="97" y2="18" stroke="#162e45" stroke-width="1"/>
      <line x1="195" y1="0" x2="195" y2="18" stroke="#162e45" stroke-width="1"/>
      <line x1="292" y1="0" x2="292" y2="18" stroke="#162e45" stroke-width="1"/>
      
      <!-- Animated Active Bar (87% of 390 = 339px) -->
      <rect x="0" y="0" width="339" height="18" rx="9" fill="url(#barGrad1)">
        <animate attributeName="width" values="323;339;331;339" dur="3.3s" repeatCount="indefinite"/>
      </rect>

      <rect x="0" y="0" width="75" height="18" rx="9" fill="url(#shimmerGrad)">
        <animate attributeName="x" values="-75;390" dur="2.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(665, 4)">
      <rect x="0" y="0" width="80" height="22" rx="5" fill="#0c253b" stroke="#00e5ff" stroke-width="1.2"/>
      <text x="40" y="15" text-anchor="middle" fill="#00f3fe" class="font-mono" font-size="10.5" font-weight="bold">CORE 87%</text>
    </g>
  </g>

  <!-- ================= ROW 4: Programming ================= -->
  <g transform="translate(28, 222)">
    <g transform="translate(0, 1)">
      <rect x="0" y="2" width="24" height="24" rx="5" fill="#0e263d" stroke="#56ccf2" stroke-width="1.5"/>
      <path d="M 8 10 L 5 14 L 8 18" fill="none" stroke="#56ccf2" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 16 10 L 19 14 L 16 18" fill="none" stroke="#56ccf2" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="14" y1="9" x2="10" y2="19" stroke="#56ccf2" stroke-width="1.3"/>
    </g>

    <text x="34" y="15" class="title-text">Programming</text>
    <text x="34" y="29" class="sub-text">C • C++ • Python • Java • JavaScript</text>

    <g transform="translate(260, 6)">
      <rect x="0" y="0" width="390" height="18" rx="9" fill="#0e1d2e" stroke="#1c3a57" stroke-width="1.2"/>
      <line x1="97" y1="0" x2="97" y2="18" stroke="#162e45" stroke-width="1"/>
      <line x1="195" y1="0" x2="195" y2="18" stroke="#162e45" stroke-width="1"/>
      <line x1="292" y1="0" x2="292" y2="18" stroke="#162e45" stroke-width="1"/>
      
      <!-- Animated Active Bar (86% of 390 = 335px) -->
      <rect x="0" y="0" width="335" height="18" rx="9" fill="url(#barGrad3)">
        <animate attributeName="width" values="320;335;327;335" dur="3.6s" repeatCount="indefinite"/>
      </rect>

      <rect x="0" y="0" width="75" height="18" rx="9" fill="url(#shimmerGrad)">
        <animate attributeName="x" values="-75;390" dur="3.3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(665, 4)">
      <rect x="0" y="0" width="80" height="22" rx="5" fill="#10233f" stroke="#56ccf2" stroke-width="1.2"/>
      <text x="40" y="15" text-anchor="middle" fill="#56ccf2" class="font-mono" font-size="10.5" font-weight="bold">CORE 86%</text>
    </g>
  </g>

  <!-- ================= ROW 5: AI & Sensor Processing ================= -->
  <g transform="translate(28, 274)">
    <g transform="translate(0, 1)">
      <rect x="0" y="2" width="24" height="24" rx="5" fill="#0e263d" stroke="#00ffa3" stroke-width="1.5"/>
      <circle cx="8" cy="10" r="2.2" fill="#00ffa3"/>
      <circle cx="8" cy="18" r="2.2" fill="#00ffa3"/>
      <circle cx="16" cy="14" r="2.2" fill="#00ffa3"/>
      <line x1="8" y1="10" x2="16" y2="14" stroke="#00ffa3" stroke-width="1.2" opacity="0.7"/>
      <line x1="8" y1="18" x2="16" y2="14" stroke="#00ffa3" stroke-width="1.2" opacity="0.7"/>
    </g>

    <text x="34" y="15" class="title-text">AI &amp; Sensor Processing</text>
    <text x="34" y="29" class="sub-text">Sensor Fusion • LSTM • Dead Reckoning</text>

    <g transform="translate(260, 6)">
      <rect x="0" y="0" width="390" height="18" rx="9" fill="#0e1d2e" stroke="#1c3a57" stroke-width="1.2"/>
      <line x1="97" y1="0" x2="97" y2="18" stroke="#162e45" stroke-width="1"/>
      <line x1="195" y1="0" x2="195" y2="18" stroke="#162e45" stroke-width="1"/>
      <line x1="292" y1="0" x2="292" y2="18" stroke="#162e45" stroke-width="1"/>
      
      <!-- Animated Active Bar (84% of 390 = 328px) -->
      <rect x="0" y="0" width="328" height="18" rx="9" fill="url(#barGrad1)">
        <animate attributeName="width" values="312;328;318;328" dur="3.2s" repeatCount="indefinite"/>
      </rect>

      <rect x="0" y="0" width="75" height="18" rx="9" fill="url(#shimmerGrad)">
        <animate attributeName="x" values="-75;390" dur="2.7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(665, 4)">
      <rect x="0" y="0" width="80" height="22" rx="5" fill="#092921" stroke="#00ffa3" stroke-width="1.2"/>
      <text x="40" y="15" text-anchor="middle" fill="#00ffa3" class="font-mono" font-size="10.5" font-weight="bold">CORE 84%</text>
    </g>
  </g>
</svg>
